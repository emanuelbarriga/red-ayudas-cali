<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red de Ayudas Cali</title>

  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body, html { height: 100%; width: 100%; display: flex; flex-direction: column; }
    header { background: #1e293b; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; }
    #map-container { position: relative; flex: 1; width: 100%; min-height: 300px; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    /* Vista pública: el mapa ocupa todo el espacio disponible */
    #vista-mapa { position: relative; display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }

    /* Visor central fijo (estilo Uber/Rappi): indica el punto a reportar */
    .map-crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -100%);
      pointer-events: none; z-index: 1000; text-align: center;
    }
    .map-crosshair .pin { font-size: 28px; line-height: 1; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); }
    .map-crosshair .label {
      background: rgba(0,0,0,0.75); color: white; padding: 2px 6px;
      border-radius: 4px; font-size: 10px; white-space: nowrap;
    }

    .btn-floating {
      position: absolute; bottom: 20px; right: 20px; z-index: 1000;
      background: #2563eb; color: white; border: none; padding: 14px 20px;
      border-radius: 30px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .btn-locate {
      position: absolute; bottom: 20px; left: 20px; z-index: 1000;
      background: #0ea5e9; color: white; border: none; padding: 12px 16px;
      border-radius: 30px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* Modal Formulario */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px;
      max-height: 90vh; overflow-y: auto;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem;
    }
    .btn-submit { background: #16a34a; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 1rem; }
    .btn-close { background: #dc2626; color: white; padding: 8px; border: none; border-radius: 6px; width: 100%; margin-top: 6px; cursor: pointer; }

    /* Popups del mapa */
    .popup-card h3 { margin-bottom: 6px; font-size: 1rem; color: #0f172a; }
    .popup-card p { font-size: 0.85rem; margin-bottom: 4px; color: #334155; }
    .popup-img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin: 6px 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; margin-bottom: 8px; }
    .bg-ABIERTO { background: #dc2626; }
    .bg-EN_VERIFICACION { background: #f59e0b; }
    .bg-ATENDIENDO { background: #2563eb; }
    .bg-CERRADO { background: #16a34a; }

    .popup-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .btn-status { border: none; padding: 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: white; }

    /* Tabla operativa */
    .tabla-container { padding: 15px; margin-top: 20px; overflow-x: auto; }
    .tabla-container h2 { font-size: 1rem; margin-bottom: 10px; color: #0f172a; }
    #tabla-puntos { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; background: white; }
    #tabla-puntos th { background: #f1f5f9; padding: 8px; border-bottom: 2px solid #cbd5e1; white-space: nowrap; }
    #tabla-puntos td { padding: 8px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    #tabla-puntos tr:hover td { background: #f8fafc; }
    .prio-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 0.75rem; }
    .prio-ALTA { background: #dc2626; }
    .prio-MEDIA { background: #f59e0b; }
    .prio-BAJA { background: #16a34a; }
    #tabla-puntos select { padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.8rem; }

    /* Botón modo coordinación */
    .btn-coord {
      background: #e74c3c; color: white; border: none; padding: 6px 10px;
      border-radius: 10px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap;
    }

    /* Adaptación Responsive para Móviles */
    @media (max-width: 768px) {
      body { display: flex; flex-direction: column; margin: 0; padding: 0; }

      /* Mapa fijo arriba: deja ver la tabla/formulario debajo */
      #map-container {
        height: 45vh; width: 100%;
        position: sticky; top: 0; z-index: 500;
        flex: none; min-height: 0;
      }

      /* Tabla con scroll horizontal suave */
      .tabla-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        margin-top: 10px;
      }
      #tabla-puntos { font-size: 12px; white-space: nowrap; }
      #tabla-puntos th, #tabla-puntos td { padding: 8px 5px; }

      /* Formulario: evita zoom automático en iOS */
      .form-group input, .form-group select, .form-group textarea {
        width: 100% !important;
        box-sizing: border-box;
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📍 Red de Ayudas Cali</h1>
    <span id="gps-status" style="font-size:0.75rem; background:#334155; padding:4px 8px; border-radius:10px;">GPS: Buscando...</span>
    <div style="display:flex; gap:6px;">
      <button class="btn-locate" onclick="obtenerMiUbicacion()">📍 Mi ubicación</button>
      <button class="btn-coord" id="btn-coord" onclick="solicitarAccesoCoordinador()">📋 Tabla</button>
    </div>
  </header>

  <!-- VISTA MAPA (PÚBLICO) -->
  <div id="vista-mapa">
    <div id="map-container">
      <div id="map"></div>

      <!-- VISOR CENTRAL FIJO: indica el punto exacto a reportar -->
      <div class="map-crosshair">
        <div class="pin">📍</div>
        <div class="label">Punto de reporte</div>
      </div>
    </div>

    <button class="btn-floating" onclick="abrirModal()">+ Reportar Punto</button>
  </div>

  <!-- Modal Crear Solicitud -->
  <div class="modal" id="modalReporte">
    <div class="modal-content">
      <h2>Nuevo Reporte en Sitio</h2>
      <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 12px;">Mueve el mapa para ubicar el punto exacto con el pin central 📍. Se usará esa posición.</p>

      <div class="form-group">
        <label>Nombre del Punto / Lugar</label>
        <input type="text" id="nombrePunto" placeholder="Ej: Canchas Barrio Siloé">
      </div>

      <div class="form-group">
        <label>Coordinador Encargado en Sitio</label>
        <input type="text" id="coordinador" placeholder="Nombre y Teléfono de contacto">
      </div>

      <div class="form-group">
        <label>¿Hay Personal Técnico / AV Presente?</label>
        <select id="tecnicoPresente">
          <option value="NO">NO (Requiere verificación)</option>
          <option value="SI">SÍ (Técnicos verificando)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Prioridad de Atención</label>
        <select id="prioridad">
          <option value="MEDIA">MEDIA (Suministros)</option>
          <option value="ALTA">ALTA (Urgente / Riesgo vital)</option>
          <option value="BAJA">BAJA (Organización / Inventario)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Foto del Lugar / Situación (Opcional)</label>
        <!-- Permite abrir la cámara trasera en celulares o elegir de galería -->
        <input type="file" id="fotoInput" accept="image/*" capture="environment">
      </div>

      <div class="form-group">
        <label>Necesidades Específicas</label>
        <textarea id="necesidades" rows="2" placeholder="Ej: Comida no perecedera, colchonetas, 5 voluntarios"></textarea>
      </div>

      <div class="form-group">
        <label>Situación / Estado Actual</label>
        <textarea id="situacion" rows="2" placeholder="Acceso, riesgos, condiciones del sitio"></textarea>
      </div>

      <button class="btn-submit" id="btnGuardar" onclick="guardarPunto()">Guardar y Publicar Punto</button>
      <button class="btn-close" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- VISTA TABLA (SOLO COORDINADORES) -->
  <div id="vista-tabla" style="display:none; flex:1; overflow-y:auto;">
    <div class="tabla-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2>📋 Matriz de Prioridades y Despachos</h2>
        <button class="btn-coord" onclick="cerrarModoCoordinador()" style="background:#64748b;">🔒 Salir de Coordinación</button>
      </div>
      <table id="tabla-puntos">
        <thead>
          <tr>
            <th>Prioridad</th>
            <th>Punto / Sector</th>
            <th>Necesidades Urgentes</th>
            <th>Coordinador</th>
            <th>Técnico/AV</th>
            <th>Estado</th>
            <th>Acción Rápida</th>
          </tr>
        </thead>
        <tbody id="tabla-puntos-body">
          <!-- Se llena dinámicamente desde Firestore -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ⚠️ REEMPLAZA apiKey, messagingSenderId Y appId CON TUS VALORES REALES DE FIREBASE
    const firebaseConfig = {

      apiKey: "AIzaSyC52vHtvd6l0lRhTq_iGkdSf0ljfHqN4oY",
      authDomain: "red-ayudas-cali.firebaseapp.com",
      projectId: "red-ayudas-cali",
      storageBucket: "red-ayudas-cali.firebasestorage.app",
      messagingSenderId: "560396986116",
      appId: "1:560396986116:web:49c3f78d0a26d09e62d251"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Inicializar Mapa en Cali
    const map = L.map('map').setView([3.4516, -76.5320], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let userLat = 3.4516;
    let userLng = -76.5320;
    let gpsConfirmado = false;
    let markers = {};
    let miMarcador = null; // Marcador azul "Estás aquí"

    // Obtener GPS del usuario (gpsConfirmado = true solo con señal real)
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          gpsConfirmado = true;
          document.getElementById('gps-status').innerText = "GPS: Preciso";
          document.getElementById('gps-status').style.background = "#16a34a";
        },
        (err) => {
          gpsConfirmado = false;
          document.getElementById('gps-status').innerText = "GPS: Sin señal";
          document.getElementById('gps-status').style.background = "#dc2626";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Centrar el mapa en la ubicación actual del usuario (botón "Mi ubicación")
    window.obtenerMiUbicacion = function() {
      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          userLat = lat;
          userLng = lng;
          gpsConfirmado = true;

          // Centrar el mapa en la posición del usuario
          map.setView([lat, lng], 15);

          // Crear o mover el marcador azul "Estás aquí"
          if (miMarcador) {
            miMarcador.setLatLng([lat, lng]);
          } else {
            miMarcador = L.marker([lat, lng], {
              icon: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
              })
            }).addTo(map).bindPopup("<b>📍 Estás aquí (Mi Punto)</b>").openPopup();
          }

          document.getElementById('gps-status').innerText = "GPS: Preciso";
          document.getElementById('gps-status').style.background = "#16a34a";
        },
        (error) => {
          console.warn("Error obteniendo ubicación:", error.message);
          alert("No se pudo obtener tu ubicación actual. Verifica que los permisos de GPS estén activos.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    };

    // ⚠️ ACCESO COORDINADOR — clave simple en el cliente (NO es seguridad real,
    // solo separa la UI pública de la vista operativa. Ver notas en README/issue).
    const CLAVE_COORDINADOR = "cali2026"; // CAMBIA esta clave con tu equipo
    let esCoordinador = false;

    // Comprobar acceso guardado en este dispositivo o por URL (?admin=cali2026)
    (function verificarAccesoCoordinador() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === CLAVE_COORDINADOR) {
        esCoordinador = true;
        localStorage.setItem('esCoordinador', 'true');
      } else if (localStorage.getItem('esCoordinador') === 'true') {
        esCoordinador = true;
      }
    })();

    // Alternar entre vista mapa (público) y tabla (coordinación)
    function mostrarVista(vista) {
      const vMapa = document.getElementById('vista-mapa');
      const vTabla = document.getElementById('vista-tabla');

      if (vista === 'mapa') {
        vMapa.style.display = 'flex';
        vTabla.style.display = 'none';
        // Forzar recálculo del tamaño del mapa al volver (Leaflet necesita saber su nuevo tamaño)
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        vMapa.style.display = 'none';
        vTabla.style.display = 'block';
      }
    }

    // Botón "📋 Tabla": pide la clave si no es coordinador
    window.solicitarAccesoCoordinador = function() {
      if (esCoordinador) {
        mostrarVista('tabla');
        return;
      }
      const pass = prompt("Acceso restringido a coordinadores.\nIngresa la clave de acceso:");
      if (pass === CLAVE_COORDINADOR) {
        esCoordinador = true;
        localStorage.setItem('esCoordinador', 'true');
        mostrarVista('tabla');
      } else if (pass !== null) {
        alert("Clave incorrecta.");
      }
    };

    // Botón "🔒 Salir de Coordinación"
    window.cerrarModoCoordinador = function() {
      esCoordinador = false;
      localStorage.removeItem('esCoordinador');
      mostrarVista('mapa');
    };

    // Colores de los Pines
    function getIconColor(estado, tieneTecnico) {
      let color = "red";
      if (estado === "CERRADO") color = "green";
      else if (estado === "ATENDIENDO") color = "blue";
      else if (estado === "EN_VERIFICACION") color = "orange";
      else if (tieneTecnico === "NO") color = "red";

      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    // Escuchar Firestore en Tiempo Real (mapa + tabla operativa)
    onSnapshot(collection(db, "puntos_cali"), (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const data = change.doc.data();
        const id = change.doc.id;

        if (change.type === "added" || change.type === "modified") {
          if (markers[id]) map.removeLayer(markers[id]);

          const icon = getIconColor(data.estado, data.tecnicoPresente);
          const marker = L.marker([data.lat, data.lng], { icon: icon }).addTo(map);
          const mapsUrl = `https://www.google.com/maps?q=${data.lat},${data.lng}`;

          // Solo permitir URLs http(s) como imagen; cualquier otra cosa se ignora
          const fotoHTML = (data.fotoUrl && (data.fotoUrl.startsWith('https://') || data.fotoUrl.startsWith('http://')))
            ? `<img src="${escapeHTML(data.fotoUrl)}" class="popup-img" alt="Foto punto" onerror="this.style.display='none'">`
            : '';

          const popupContent = `
            <div class="popup-card">
              <span class="badge bg-${data.estado}">${escapeHTML(data.estado.replace('_', ' '))}</span>
              <h3>${escapeHTML(data.nombrePunto)}</h3>
              ${fotoHTML}
              <p><strong>👤 Coord:</strong> ${escapeHTML(data.coordinador)}</p>
              <p><strong>🛠️ Técnico en sitio:</strong> ${escapeHTML(data.tecnicoPresente)}</p>
              <p><strong>📦 Necesidades:</strong> ${escapeHTML(data.necesidades)}</p>
              <p><strong>⚠️ Situación:</strong> ${escapeHTML(data.situacion)}</p>
              <p><strong>📍 Coordenadas:</strong> ${typeof data.lat === 'number' && typeof data.lng === 'number' ? `${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}` : 'N/A'}</p>
              <p><a href="${mapsUrl}" target="_blank" style="color:#2563eb; font-weight:bold;">📍 Ver en Google Maps</a></p>
            </div>
          `;

          marker.bindPopup(popupContent);
          markers[id] = marker;
        }

        if (change.type === "removed") {
          if (markers[id]) {
            map.removeLayer(markers[id]);
            delete markers[id];
          }
        }

        // Sincronizar la tabla operativa con el mismo snapshot
        renderizarFilaTabla(change.doc, change.type);
      });
    });

    // Escapar HTML: protege contra XSS en datos provenientes de Firestore
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Orden de prioridad para la tabla (ALTA primero)
    const ORDEN_PRIORIDAD = { ALTA: 0, MEDIA: 1, BAJA: 2 };
    const ETIQUETAS_ESTADO = {
      ABIERTO: '🔴 Pendiente',
      EN_VERIFICACION: '🟡 En Verificación',
      ATENDIENDO: '🔵 Atendiendo',
      CERRADO: '🟢 Resuelto'
    };

    // Renderizar/actualizar la fila de la tabla operativa (usa el esquema real)
    function renderizarFilaTabla(docRef, tipoCambio) {
      const tbody = document.getElementById('tabla-puntos-body');
      if (!tbody) return;

      if (tipoCambio === 'removed') {
        const fila = document.getElementById('row-' + docRef.id);
        if (fila) fila.remove();
        return;
      }

      const data = docRef.data();
      const docId = docRef.id;
      const prioridad = ORDEN_PRIORIDAD[data.prioridad] !== undefined ? data.prioridad : 'MEDIA';
      const estado = ETIQUETAS_ESTADO[data.estado] ? data.estado : 'ABIERTO';
      const mapsUrl = (typeof data.lat === 'number' && typeof data.lng === 'number')
        ? `https://maps.google.com/?q=${data.lat},${data.lng}`
        : null;

      const filaHTML = `
        <tr id="row-${docId}" data-prioridad="${prioridad}">
          <td><span class="prio-badge prio-${prioridad}">${escapeHTML(prioridad)}</span></td>
          <td><strong>${escapeHTML(data.nombrePunto || 'Sin Nombre')}</strong></td>
          <td>${escapeHTML(data.necesidades || 'N/A')}</td>
          <td>${escapeHTML(data.coordinador || 'N/A')}</td>
          <td>${escapeHTML(data.tecnicoPresente || 'NO')}</td>
          <td>
            <select onchange="cambiarEstado('${docId}', this.value)">
              <option value="ABIERTO" ${estado === 'ABIERTO' ? 'selected' : ''}>🔴 Pendiente</option>
              <option value="EN_VERIFICACION" ${estado === 'EN_VERIFICACION' ? 'selected' : ''}>🟡 En Verificación</option>
              <option value="ATENDIENDO" ${estado === 'ATENDIENDO' ? 'selected' : ''}>🔵 Atendiendo</option>
              <option value="CERRADO" ${estado === 'CERRADO' ? 'selected' : ''}>🟢 Resuelto</option>
            </select>
          </td>
          <td>${mapsUrl ? `<a href="${mapsUrl}" target="_blank" style="color:#2563eb; font-weight:bold;">📍 Ir a Maps</a>` : '—'}</td>
        </tr>
      `;

      // Insertar o actualizar fila existente
      const filaExistente = document.getElementById('row-' + docId);
      if (filaExistente) {
        filaExistente.outerHTML = filaHTML;
      } else {
        tbody.insertAdjacentHTML('beforeend', filaHTML);
      }

      // Reordenar por prioridad (ALTA -> MEDIA -> BAJA)
      Array.from(tbody.children)
        .sort((a, b) => {
          const pa = a.dataset.prioridad || 'MEDIA';
          const pb = b.dataset.prioridad || 'MEDIA';
          return (ORDEN_PRIORIDAD[pa] ?? 1) - (ORDEN_PRIORIDAD[pb] ?? 1);
        })
        .forEach(fila => tbody.appendChild(fila));
    }

    // Comprimir imagen en cliente (Canvas ~300 KB) antes de subir a Storage
    function comprimirImagen(file, maxWidth = 1000, calidad = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Error al comprimir la imagen"));
              },
              'image/jpeg',
              calidad
            );
          };
        };
        reader.onerror = (error) => reject(error);
      });
    }

    // Coordenadas del punto a reportar: el CENTRO del mapa (donde apunta el pin central)
    function obtenerCoordenadasDelVisor() {
      const centro = map.getCenter();
      return { lat: centro.lat, lng: centro.lng };
    }

    // Guardar Punto en Firestore + Subir Foto
    window.guardarPunto = async function() {
      const nombre = document.getElementById('nombrePunto').value;
      const coordinador = document.getElementById('coordinador').value;
      const tecnicoPresente = document.getElementById('tecnicoPresente').value;
      const prioridad = document.getElementById('prioridad').value;
      const necesidades = document.getElementById('necesidades').value;
      const situacion = document.getElementById('situacion').value;
      const fotoFile = document.getElementById('fotoInput').files[0];
      const btnGuardar = document.getElementById('btnGuardar');

      if (!nombre || !coordinador) {
        alert("Por favor completa el nombre del punto y el coordinador.");
        return;
      }

      // El punto se marca donde apunta el pin central (centro del mapa)
      const { lat, lng } = obtenerCoordenadasDelVisor();

      // Validar que el punto esté dentro del área de Cali (mismas reglas del servidor)
      if (!(lat >= 3.20 && lat <= 3.55 && lng >= -76.65 && lng <= -76.45)) {
        alert("⚠️ El pin central está fuera del área de Cali. Mueve el mapa para ubicar el punto dentro de la zona de cobertura.");
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.innerText = "Subiendo datos y foto...";

      let fotoUrl = null;

      try {
        // Subir foto a Firebase Storage si seleccionó archivo
        if (fotoFile) {
          // Comprimir antes de subir (crítico en redes móviles inestables)
          const blobComprimido = await comprimirImagen(fotoFile);
          // Nombre seguro: solo caracteres [A-Za-z0-9._-]
          const nombreSeguro = (fotoFile.name || 'foto').replace(/[^a-zA-Z0-9._-]/g, '_');
          const fileRef = ref(storage, `fotos_puntos/${Date.now()}_${nombreSeguro}`);
          await uploadBytes(fileRef, blobComprimido);
          fotoUrl = await getDownloadURL(fileRef);
        }

        // Crear documento en Firestore
        await addDoc(collection(db, "puntos_cali"), {
          nombrePunto: nombre,
          coordinador: coordinador,
          tecnicoPresente: tecnicoPresente,
          prioridad: prioridad,
          necesidades: necesidades,
          situacion: situacion,
          fotoUrl: fotoUrl,
          lat: lat,
          lng: lng,
          estado: "ABIERTO",
          timestamp: serverTimestamp()
        });

        alert("¡Punto y foto publicados con éxito en el mapa!");
        cerrarModal();
      } catch (e) {
        alert("Error al guardar: " + e.message);
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = "Guardar y Publicar Punto";
      }
    };

    // Cambiar Estado en Firestore
    window.cambiarEstado = async function(id, nuevoEstado) {
      try {
        const puntoRef = doc(db, "puntos_cali", id);
        await updateDoc(puntoRef, { estado: nuevoEstado });
      } catch (e) {
        alert("Error actualizando estado: " + e.message);
      }
    };

    // Funciones del Modal
    window.abrirModal = () => {
      // Punto de partida del pin central: tu posición GPS real si hay señal,
      // luego el usuario ajusta moviendo el mapa.
      if (gpsConfirmado) {
        map.setView([userLat, userLng], 15);
      }
      document.getElementById('modalReporte').style.display = 'flex';
    };
    window.cerrarModal = () => document.getElementById('modalReporte').style.display = 'none';
  </script>
</body>
